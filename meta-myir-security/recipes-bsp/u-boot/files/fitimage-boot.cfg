# fitImage boot + FIT signature verification for i.MX95
#
# Modifications:
#   1. Enables U-Boot FIT signature verification (CONFIG_FIT_SIGNATURE)
#   2. CONFIG_PREBOOT sets image=fitImage, boot_fit=yes, sec_boot=no
#      (runs AFTER board_late_init() which sets sec_boot=yes on AHAB)
#   3. mmcboot/netboot fit_config logic is in the .env source file:
#        board/myir/myd_jmx95/myd_jmx95.env
#      — no need to override via cfg
#
# fit_config usage in U-Boot CLI:
#   setenv fit_config conf-myd-jmx95-15x15-lt9611-lvds1-ov5640.dtb
#   saveenv
#

# --- Crypto: FIT signature verification ---
CONFIG_FIT_SIGNATURE=y
CONFIG_FIT_SIGNATURE_STRICT=y
CONFIG_FIT_SIGNATURE_MAX_SIZE=0x10000000
CONFIG_FIT_VERBOSE=y
CONFIG_FIT_ENABLE_SHA256_SUPPORT=y
CONFIG_FIT_ENABLE_SHA384_SUPPORT=y
CONFIG_FIT_ENABLE_SHA512_SUPPORT=y
CONFIG_FIT_ENABLE_RSASSA_PSS_SUPPORT=y
CONFIG_RSA=y
CONFIG_RSA_VERIFY=y
CONFIG_RSA_VERIFY_WITH_PKEY=y

# --- FitImage boot via PREBOOT ---
# board_late_init() sets sec_boot=yes when CONFIG_AHAB_BOOT=y.
# We override it here: sec_boot=no => bypass kernel container path,
# boot_fit=yes => use bootm (FIT) instead of booti (container).
CONFIG_USE_PREBOOT=y
CONFIG_PREBOOT="setenv image fitImage; setenv boot_fit yes; setenv sec_boot no"
