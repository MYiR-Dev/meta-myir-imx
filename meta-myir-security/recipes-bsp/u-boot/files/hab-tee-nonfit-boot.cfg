# i.MX6ULL HAB+TEE non-FIT boot command
#
# Boot flow:
#   1. Load signed kernel zImage (fatload via loadimage)
#      The signed image has a FIXED 8KB tail:
#        ┌──────────┬──────┬───────┬──────────────────┐
#        │  zImage  │ IVT  │  CSF  │  padding         │
#        │ (padded) │(32B) │ (~4K) │  (to 8K total)   │
#        └──────────┴──────┴───────┴──────────────────┘
#                         ↑ pad_off = filesize - 0x2000
#   2. setexpr pad_off ${filesize} - 0x2000  -> auto-calculate IVT offset
#   3. hab_auth_img with dynamic IVT offset
#
# The IVT offset is derived from the loaded file size — no external
# hab_pad.bin file needed. This matches the manual genIVT/signed_zimage
# approach used in the reference signing scripts.
CONFIG_BOOTCOMMAND="run findfdt;run findtee;mmc dev ${mmcdev}; if mmc rescan; then if run loadbootscript; then run bootscript; else if run loadimage; then setexpr pad_off ${filesize} - 0x2000; hab_auth_img ${loadaddr} ${filesize} ${pad_off}; run mmcboot; else run netboot; fi; fi; else run netboot; fi"
CONFIG_SYS_LOAD_ADDR=0x80800000
