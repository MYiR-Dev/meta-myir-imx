# i.MX6ULL fitImage boot command — machine-specific.
#
# Included by u-boot-fit-signature.inc when MYIR_FIT_ENABLE=1
# AND the machine is mx6ull-generic-bsp.
#
# Sets BOOTCOMMAND to "saveenv; run mmcfboot", which is defined in
# include/configs/myd_y6ull_14x14.h alongside existing mmcboot/nandboot.
#
# The saveenv prefix fixes fresh-flash boot failure: on a newly-flashed
# eMMC, the U-Boot env area contains 0xFF → CRC32 fails → compiled-in
# defaults are used. saveenv writes a valid env on first boot, ensuring
# variables like bootslot/mmcroot are persisted for subsequent boots.
#
# mmcfboot flow:
#   1. saveenv                    → persist env to eMMC (fixes fresh flash)
#   2. setenv image fitImage      → loadimage loads fitImage
#   3. mmc dev ${mmcdev}; rescan  → init eMMC
#   4. run loadimage              → fatload mmc ${mmcdev}:${mmcpart} ${loadaddr} ${image}
#   5. run select_bootslot        → dualA/B slot → mmcroot
#   6. run mmcargs                → setenv bootargs
#   7. bootm ${loadaddr}          → boot fitImage
#      - cmd/bootm.c IMAGE_FORMAT_FIT case → authenticate_image() (HAB)
#      - bootm internally verifies FIT sub-image signatures (CONFIG_FIT_SIGNATURE)
#
# HAB auth chain:
#   ROM → SPL/u-boot(signed) → bootcmd=saveenv; run mmcfboot → bootm → hab_auth_img(FIT)
#                                                                      → FIT sig verify(kernel/dtb)
CONFIG_BOOTCOMMAND="run mmcfboot"
CONFIG_SYS_LOAD_ADDR=0x82000000
