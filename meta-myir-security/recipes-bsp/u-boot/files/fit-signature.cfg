# FIT image signature verification for i.MX6ULL HABv4
#
# Generic FIT signature configs only — no machine-specific BOOTCOMMAND.
# The 6ULL boot command (run mmcfboot) is in fit-boot-6ull.cfg,
# included separately by u-boot-fit-signature.inc.
CONFIG_FIT_SIGNATURE=y
CONFIG_FIT_SIGNATURE_MAX_SIZE=0x10000000
CONFIG_FIT_VERBOSE=y
CONFIG_RSA=y
CONFIG_RSA_VERIFY=y
CONFIG_RSA_VERIFY_WITH_PKEY=y
