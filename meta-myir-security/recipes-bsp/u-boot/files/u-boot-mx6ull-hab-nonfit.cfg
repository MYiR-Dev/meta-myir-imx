# i.MX6ULL HABv4 Non-FIT Mode U-Boot Configuration Fragment
#
# This fragment is ONLY included when MYIR_HAB_TEE_MODE=nonfit.
# It contains settings that would break FIT mode if applied unconditionally.
#
# Two key settings:
#   1. CONFIG_LEGACY_IMAGE_FORMAT=y
#      Required for bootm to parse the OP-TEE uImage (legacy format).
#      Enabling this changes bootm's image format detection logic and can
#      interfere with the FIT path when CONFIG_SYS_LOAD_ADDR=0x82000000.
#
#   2. CONFIG_IMX_HAB_KERNEL_IVT_OFFSET=0x1000000
#      When authenticate_image() is called from bootm for a zImage at
#      CONFIG_SYS_LOAD_ADDR (0x80800000), use a fixed 16MB IVT offset
#      instead of calculating from raw zImage size. The zImage is padded
#      to 16MB and IVT+CSF are appended at that offset.
#
#      IMPORTANT: This must NOT be set for FIT mode because:
#        - FIT mode sets CONFIG_SYS_LOAD_ADDR=0x82000000 (loadaddr)
#        - The FIT image is loaded to 0x82000000 (= CONFIG_SYS_LOAD_ADDR)
#        - authenticate_image() would then use the fixed 16MB offset
#          instead of ALIGN(fit_size, 0x1000), looking for the IVT at
#          the wrong address → magic=0xfc error
#
# Included by: u-boot-imx_%.bbappend (meta-myir-security)
# Guard: MYIR_HAB_TEE_MODE = "nonfit"

# --- Legacy image format (required for TEE uImage parsing) ---
# CONFIG_FIT_SIGNATURE=y disables this by default, but non-FIT bootm
# needs it to parse the OP-TEE uImage at .
CONFIG_LEGACY_IMAGE_FORMAT=y

# --- Fixed kernel IVT offset (for zImage padded to 16MB) ---
# When bootm calls authenticate_image() for the kernel at
# CONFIG_SYS_LOAD_ADDR (0x80800000), use this fixed offset.
CONFIG_IMX_HAB_KERNEL_IVT_OFFSET=0x0
