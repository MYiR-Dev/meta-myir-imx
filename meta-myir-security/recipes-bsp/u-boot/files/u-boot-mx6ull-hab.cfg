# i.MX6ULL HABv4 U-Boot Configuration Fragment
#
# Enables HAB (High Assurance Boot) API and FIT image support
# for i.MX6ULL with the FIT HAB authentication patch applied
# to cmd/bootm.c (adds authenticate_image() call for FIT images).
#
# Required patch (already applied in imx6ul tree):
#   cmd/bootm.c: adds "case IMAGE_FORMAT_FIT:" under #ifdef CONFIG_FIT_SIGNATURE
#   that calls authenticate_image(image_load_addr, fit_get_size(...)).
#
# NOTE: CONFIG_FIT_SIGNATURE is used here as the compile guard in the
# patched bootm.c (not CONFIG_FIT). If you change the guard to CONFIG_FIT,
# adjust accordingly.

# --- HAB (High Assurance Boot) ---
CONFIG_IMX_HAB=y

# --- FIT image support ---
# Required for the IMAGE_FORMAT_FIT code path in bootm.c
CONFIG_FIT=y

# --- FIT signature (compile guard for HAB auth in bootm.c) ---
# NOT: this is not for per-node FIT signature verification.
# It's used as the #ifdef guard for the authenticate_image() call
# on the entire FIT blob with appended IVT+CSF.
CONFIG_FIT_SIGNATURE=y
