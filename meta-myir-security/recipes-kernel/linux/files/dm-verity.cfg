# DM-Verity kernel configuration fragment for MYIR i.MX95 secure boot
# Required for device-mapper verity target to verify rootfs integrity.

# Core dm-verity support
CONFIG_DM_VERITY=y

# Verify root hash signature (optional, for signed root hash)
CONFIG_DM_VERITY_VERIFY_ROOTHASH_SIG=y

# Forward Error Correction for dm-verity (optional, improves reliability)
CONFIG_DM_VERITY_FEC=y

# Cryptographic hash algorithms required by dm-verity
CONFIG_CRYPTO_SHA256=y
CONFIG_CRYPTO_SHA512=y

# Device mapper core (prerequisite)
CONFIG_BLK_DEV_DM=y

# Initramfs support (required for early userspace dm-verity setup)
CONFIG_BLK_DEV_INITRD=y

# Overlay filesystem support (required for writable overlays on dm-verity rootfs)
CONFIG_OVERLAY_FS=y
