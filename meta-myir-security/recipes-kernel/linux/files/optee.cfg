# optee.cfg - Kernel OP-TEE support fragment
# Required for RPMB-FS secure storage to work
#

# OP-TEE driver - required for communication between Linux and OP-TEE
CONFIG_OPTEE=y
CONFIG_TEE=y

# Dynamic shared memory support (needed for RPMB-FS RPC calls)
CONFIG_OPTEE_SHM_NUM_PRIV_PAGES=1

# OP-TEE fTPM support (optional, for TPM 2.0 over TEE)
# CONFIG_TCG_FTPM_TEE=y

# Hardware random number generator (if HWRNG PTA is used)
# CONFIG_HW_RANDOM_OPTEE=y
