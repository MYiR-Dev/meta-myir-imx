# rpmb.cfg - Kernel RPMB subsystem support
# Required for OP-TEE RPMB-FS in-kernel routing
#
# Without CONFIG_RPMB, the kernel forwards RPMB RPC commands (0x16-0x18)
# to tee-supplicant, but NXP optee-client 4.8 only supports old protocol
# (cmd 0x01), causing Cmd 0x16 not supported errors.
#
# With CONFIG_RPMB=y, the kernel handles RPMB routing internally via
# the RPMB subsystem, and rpmb_routing_model changes from user to kernel.

# RPMB subsystem core
CONFIG_RPMB=y

# MMC block RPMB device registration
CONFIG_MMC_BLOCK=y
