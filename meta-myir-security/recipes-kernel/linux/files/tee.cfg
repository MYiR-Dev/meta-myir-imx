# tee.cfg
# OP-TEE Trusted Keys backend kernel config fragment
#
# 同时服务于两条路径:
#   1. dm-crypt 加密路径 (myir-encrypted OVERRIDE → ${MYIR_ENC_KEY_BACKEND}.cfg)
#   2. RPMB-FS 安全存储路径 (MYIR_OPTEE_STORAGE = "rpmb" → linux-optee.inc)
#
# i.MX95 没有 CAAM 硬件, 使用 ELE + OP-TEE 作为密钥后端.
# 本文件替代 caam.cfg, 明确禁用 CAAM/TPM 作为 Trusted Keys 后端.

# Trusted Keys 基础框架
CONFIG_TRUSTED_KEYS=y

# 使用 OP-TEE (TEE) 作为 Trusted Keys 后端
CONFIG_TRUSTED_KEYS_TEE=y

# 显式禁用 CAAM — i.MX95 无此硬件 (使用 ELE)
# CONFIG_TRUSTED_KEYS_CAAM is not set

# 显式禁用 TPM — 除非有硬件 TPM 或 fTPM
# CONFIG_TRUSTED_KEYS_TPM is not set

# Trusted Keys 所需的加密原语
CONFIG_CRYPTO_AUTHENC=y
CONFIG_CRYPTO_CBC=y
CONFIG_CRYPTO_XTS=y
CONFIG_CRYPTO_ESSIV=y
