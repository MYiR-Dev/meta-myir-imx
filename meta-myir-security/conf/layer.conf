# i.MX95 Secure Boot Layer Configuration

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb             ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "myir-security"
BBFILE_PATTERN_myir-security := "^${LAYERDIR}/"
BBFILE_PRIORITY_myir-security = "10"

LAYERSERIES_COMPAT_myir-security = "mickledore nanbield scarthgap styhead walnascar"

# Depend on BSP layer for machine configs and freescale-layer for base
LAYERDEPENDS_myir-security = "fsl-bsp-release freescale-layer"

# Security-specific distro features
DISTRO_FEATURES:append = " ${@bb.utils.contains('MYIR_SECURE_BOOT', '1', ' secureboot', '', d)}"

# CST tool location - users should set this to their CST installation path
MYIR_CST_DIR ?= "${TOPDIR}/keys/cst"
MYIR_CST_BIN ?= "${MYIR_CST_DIR}/linux64/bin/cst"

# Default: ECC secp384r1 for i.MX95 AHAB
MYIR_AHAB_KEY_TYPE ?= "ecc"
MYIR_AHAB_KEY_CURVE ?= "secp384r1"
MYIR_AHAB_DIGEST ?= "sha384"
MYIR_AHAB_SRK_INDEX ?= "1"

# Certificate and key paths
MYIR_AHAB_CRTS_DIR ?= "${MYIR_CST_DIR}/crts"
MYIR_AHAB_KEYS_DIR ?= "${MYIR_CST_DIR}/keys"
MYIR_AHAB_SRK_TABLE ?= "${MYIR_AHAB_CRTS_DIR}/SRK_1_2_3_4_tables.bin"
MYIR_AHAB_SRK_FUSE ?= "${MYIR_AHAB_CRTS_DIR}/SRK_1_2_3_4_fuses.bin"

# ==========================================================================
# Keys directory structure (single unified symlink)
#
# All key material lives in this layer at: files/keys/
#   files/keys/cst/  - CST tool (binary + AHAB keys/certs)
#   files/keys/fit/  - FIT image signing keys
#
# myir-setup-release.sh creates: TOPDIR/keys -> LAYERDIR/files/keys/
# All recipes reference keys through TOPDIR/keys/cst/... and TOPDIR/keys/fit/...
# ==========================================================================

# ==========================================================================
# HABv4 (i.MX6/7) Secure Boot Variables
#
# The HAB (High Assurance Boot v4) signing path is separate from AHAB.
# All HAB variables are scoped by MYIR_HAB_ENABLE and mx6ull-generic-bsp
# override, ensuring zero impact on i.MX95 (mx9-generic-bsp) builds.
# ==========================================================================

# Master switch for HABv4 secure boot (i.MX6ULL/6/7)
# Set to "1" in machine config or local.conf to enable
MYIR_HAB_ENABLE ?= "0"

# HAB CST binary (same CST tool, different usage mode vs AHAB)
MYIR_HAB_CST_DIR ?= "${TOPDIR}/keys/cst"
MYIR_HAB_CST_BIN ?= "${MYIR_HAB_CST_DIR}/linux64/bin/cst"

# HAB key parameters (RSA 2048, SHA-256 by default)
MYIR_HAB_CST_CRYPTO    ?= "rsa"
MYIR_HAB_CST_KEY_SIZE  ?= "2048"
MYIR_HAB_CST_KEY_EXP   ?= "65537"
MYIR_HAB_CST_DIG_ALGO  ?= "sha256"
MYIR_HAB_CST_SRK_CA    ?= "1"
MYIR_HAB_CST_SRK_INDEX ?= "1"

# ==========================================================================
# FIT Image Signing Keys (shared between HABv4 kernel and U-Boot)
#
# FIT RSA keys are used to sign the kernel fitImage and to verify the
# signature at U-Boot boot time. Keys live at TOPDIR/keys/fit/.
# ==========================================================================
MYIR_FIT_KEY_DIR   ?= "${TOPDIR}/keys/fit"
MYIR_FIT_HASH_ALG  ?= "sha256"
MYIR_FIT_SIGN_ALG  ?= "rsa2048"
# Master switch for FIT Image signing (kernel fitImage + U-Boot FIT verification)
# Defaults to MYIR_HAB_ENABLE: when HAB is on, FIT auto-enables.
# Set explicitly to "0" to use HAB-signed U-Boot with plain zImage kernel.
MYIR_FIT_ENABLE ?= "${MYIR_HAB_ENABLE}"

# ==========================================================================
# HAB Kernel Signing (IVT+CSF) — NXP i.MX6 Reference Method
#
# This is the NXP-documented approach: HAB ROM API authenticates the
# kernel image directly using an IVT (Image Vector Table) + CSF binary
# appended to the kernel. No fitImage or U-Boot FIT engine involved.
#
# Mutually exclusive with MYIR_FIT_ENABLE:
#   MYIR_FIT_ENABLE=1   → fitImage signed by U-Boot FIT RSA
#   MYIR_KERNEL_HAB_SIGN=1 → kernel signed by HAB ROM API (IVT+CSF)
#
# Use MYIR_HAB_KERNEL_LOADADDR to set the DDR address where U-Boot
# loads the kernel. This MUST match the bootscript or U-Boot env.
# ==========================================================================

# Master switch for kernel HAB signing (IVT+CSF method)
# Default: disabled. Set to "1" in machine config to enable.
# MYIR_FIT_ENABLE should be "0" when this is enabled.
MYIR_KERNEL_HAB_SIGN ?= "0"

# Kernel DDR load address for HAB authentication
# This is the address where U-Boot's bootz/booti loads the kernel.
# i.MX6ULL default: 0x80800000 (matches UBOOT_ENTRYPOINT for mx6ull-generic-bsp)
# For i.MX6 SABRE-SD: 0x10800000 (from NXP official doc)
# Override in machine config if your bootloader uses a different address.
MYIR_HAB_KERNEL_LOADADDR ?= "0x80800000"
