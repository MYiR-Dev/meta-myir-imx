[core]
#enable-overlay-view=1
use-g2d=true
repaint-window=16
#idle-time=0

# === Clone Mode (uncomment to enable) ===
# clone-mode=1
# clone-connector-id=53		# LVDS-1 as source
# extend-connector-id=0		# 0 = pure clone, or set HDMI connector for extend
#
# Connector IDs: LVDS-1=53, HDMI-A-1=42
#
# Examples:
#   LVDS source -> HDMI clone:        clone-connector-id=53, extend=0
#   HDMI source -> LVDS clone:        clone-connector-id=42, extend=0
#   LVDS clone + HDMI extend:          clone-connector-id=53, extend=42

[shell]

[libinput]
touchscreen_calibrator=true

[output]
name=LVDS-1
mode=1024x600@60

[output]
name=HDMI-A-1
mode=preferred

# Clone output resolution (G2D scaled)
#[cloneoutput]
#conn_id=42
#mode=1920x1080

[screen-share]
command=@bindir@/weston --backend=rdp-backend.so --shell=fullscreen-shell.so --no-resizeable
#start-on-startup=true
