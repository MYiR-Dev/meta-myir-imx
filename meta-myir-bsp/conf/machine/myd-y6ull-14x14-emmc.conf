#@TYPE: Machine
#@NAME: NXP i.MX6ULL 14x14 Evaluation Kit
#@SOC: i.MX6ULL
#@DESCRIPTION: Machine configuration for NXP i.MX6ULL 14x14 EVK
#@MAINTAINER: Lauren Post <lauren.post@nxp.com>

MACHINEOVERRIDES =. "mx6:mx6ul:mx6ull:"

include conf/machine/include/imx-base.inc
include conf/machine/include/arm/armv7a/tune-cortexa7.inc

KERNEL_DEVICETREE_BASENAME = "myd-y6ull-14x14"
KERNEL_DEVICETREE = " \
    myir/myd-y6ull/${KERNEL_DEVICETREE_BASENAME}-emmc.dtb \
    myir/myd-y6ull/${KERNEL_DEVICETREE_BASENAME}-emmc-ecspi.dtb \
"

#UBOOT_CONFIG ??= "${@bb.utils.contains('MACHINE_FEATURES', 'emmc', 'emmc', 'sd', d)}"
UBOOT_CONFIG ??= "${@bb.utils.contains('MACHINE_FEATURES', 'optee', 'sd-optee', \
                  bb.utils.contains('MACHINE_FEATURES', 'emmc', 'emmc', 'sd', d), d)}"
UBOOT_CONFIG[sd] = "mx6ull_14x14_evk_config,sdcard"
UBOOT_CONFIG[emmc] = "myd_imx6ull_emmc_defconfig,sdcard"
UBOOT_CONFIG[nand] = "mx6ull_14x14_evk_nand_config,ubifs"
UBOOT_CONFIG[qspi1] = "mx6ull_14x14_evk_qspi1_config"
UBOOT_CONFIG[sd-optee] = "myd_y6ull_emmc_optee_defconfig,sdcard"

OPTEE_BIN_EXT = "6ullevk"

MACHINE_FEATURES += "wifi bluetooth optee bcm4339 bcm43455"

IMAGE_FSTYPES:append = " tar.bz2 ext4"

DEFAULT_TIMEZONE = "Asia/Shanghai"

# HABv4 Secure Boot (i.MX6ULL)
DISTRO_FEATURES:append = " sec_boot"
MYIR_HAB_ENABLE = "${@bb.utils.contains('DISTRO_FEATURES', 'sec_boot', '1', '0', d)}"

MYIR_HAB_CST_DIR      = "${@bb.utils.contains('MYIR_HAB_ENABLE', '1', '${TOPDIR}/keys/cst', '', d)}"
MYIR_HAB_CST_CRYPTO      = "${@bb.utils.contains('MYIR_HAB_ENABLE', '1', 'rsa', '', d)}"
MYIR_HAB_CST_KEY_SIZE      = "${@bb.utils.contains('MYIR_HAB_ENABLE', '1', '2048', '', d)}"
MYIR_HAB_CST_DIG_ALGO      = "${@bb.utils.contains('MYIR_HAB_ENABLE', '1', 'sha256', '', d)}"
MYIR_HAB_CST_SRK_CA      = "${@bb.utils.contains('MYIR_HAB_ENABLE', '1', '1', '', d)}"
MYIR_HAB_CST_SRK_INDEX      = "${@bb.utils.contains('MYIR_HAB_ENABLE', '1', '1', '', d)}"


# HAB+TEE Boot Mode (i.MX6ULL)
# Uncomment one of the following to enable HAB+TEE boot:
#MYIR_HAB_TEE_MODE = "nonfit"
MYIR_HAB_TEE_MODE = "fit"

MYIR_FIT_ENABLE = "${@bb.utils.contains('MYIR_HAB_TEE_MODE', 'fit', '1', '0', d)}"

MYIR_KERNEL_HAB_SIGN = "${@bb.utils.contains('MYIR_HAB_TEE_MODE', 'nonfit', '1', '0', d)}"

# FIT Image (HABv4 secure boot)
KERNEL_IMAGETYPE:mx6ull-generic-bsp = "${@bb.utils.contains('MYIR_FIT_ENABLE', '1', 'fitImage', 'zImage', d)}"
MYIR_HABV4_FIT_SIGN_ENABLE = "${@bb.utils.contains('MYIR_FIT_ENABLE', '1', '1', '0', d)}"
MYIR_HAB_KERNEL_LOADADDR = "${@bb.utils.contains('MYIR_FIT_ENABLE', '1', '0x82000000', '0x80800000', d)}"
# FIT kernel load address must match OP-TEE CFG_NS_ENTRY_ADDR (0x80800000)
UBOOT_LOADADDRESS:mx6ull-generic-bsp = "${@bb.utils.contains('MACHINE_FEATURES', 'optee', '0x80800000', '0x80008000', d)}"
UBOOT_SIGN_ENABLE = "${@bb.utils.contains('MYIR_FIT_ENABLE', '1', '1', '0', d)}"
INHERIT += "${@bb.utils.contains('MYIR_HABV4_FIT_SIGN_ENABLE', '1', 'myir-fit-habv4-sign', '', d)}"

FIT_GENERATE_KEYS      = "${MYIR_FIT_ENABLE}"
UBOOT_SIGN_KEYDIR      = "${@bb.utils.contains('MYIR_FIT_ENABLE', '1', '${TOPDIR}/keys/fit', '', d)}"
UBOOT_SIGN_KEYNAME     = "${@bb.utils.contains('MYIR_FIT_ENABLE', '1', 'dev', '', d)}"
UBOOT_SIGN_IMG_KEYNAME = "${@bb.utils.contains('MYIR_FIT_ENABLE', '1', 'dev2', '', d)}"

# wic boot partition: use signed fitImage when HABv4 is enabled
IMAGE_BOOT_FILES:mx6ull-generic-bsp = " \
    ${@bb.utils.contains('MYIR_FIT_ENABLE', '1', 'fitImage-${MACHINE}-signed.bin;fitImage', '${KERNEL_IMAGETYPE}', d)} \
    ${@bb.utils.contains('MYIR_FIT_ENABLE', '1', '', '${@make_dtb_boot_files(d)}', d)} \
    ${@bb.utils.contains('MYIR_HAB_TEE_MODE', 'fit', '', bb.utils.contains('MACHINE_FEATURES', 'optee', '${OPTEE_BOOT_IMAGE}', '', d), d)} \
"

# WIC image with U-Boot environment at fixed MMC offsets
WKS_FILE = "${@bb.utils.contains('MACHINE_FEATURES', 'optee', 'myd-y6ull-14x14-emmc-signed.wks.in', '${MACHINE}.wks.in', d)}"
