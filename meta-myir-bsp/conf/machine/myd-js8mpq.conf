#@TYPE: Machine
#@NAME: MYiR MYD-JS8MPQ (i.MX8M Plus)
#@SOC: i.MX8MP
#@DESCRIPTION: Machine configuration for MYiR MYD-JS8MPQ, based on imx8mp-lpddr4-evk

# Keep EVK overrides: meta-imx/meta-freescale apply many :imx8mp-lpddr4-evk
# machine overrides (KERNEL_DEVICETREE:remove etc.) that must still take effect.
MACHINEOVERRIDES =. "imx8mp-lpddr4-evk:"

require conf/machine/imx8mp-lpddr4-evk.conf

# Use the board-specific Linux configuration instead of the shared i.MX8/9 one.
IMX_KERNEL_CONFIG_AARCH64 = "myd-js8mpq_defconfig"

KERNEL_DEVICETREE:append = " \
    	 myir/myd-js8mpq.dtb \
    	 myir/myd-js8mpq-lvds1.dtb \
    	 myir/myd-js8mpq-lvds-dual.dtb \
    	 myir/myd-js8mpq-dsi.dtb \
	 myir/myd-js8mpq-hdmi-ov5640.dtb \
    	 myir/myd-js8mpq-hdmi-ov13855-isp.dtb \
    	 myir/myd-js8mpq-lvds0-lvds1.dtb \
    	 myir/myd-js8mpq-2g.dtb \
    	 myir/myd-js8mpq-dsi-2g.dtb \
    	 myir/myd-js8mpq-lvds1-2g.dtb \
    	 myir/myd-js8mpq-lvds-dual-2g.dtb \
	 myir/myd-js8mpq-hdmi-ov5640-2g.dtb \
	 myir/myd-js8mpq-hdmi-ov13855-isp-2g.dtb \
	 myir/myd-js8mpq-lvds0-lvds1-2g.dtb \
	 myir/myd-js8mpq-hdmi-max96722-2g.dtb \
"

# EVK DTBs inherited from imx8mp-lpddr4-evk.conf are not applicable to
# MYD-JS8MPQ. Keep the EVK machine inheritance for the remaining NXP BSP
# settings, but exclude these DTBs from this board's build and boot image.
MYD_JS8MPQ_UNUSED_EVK_DTBS = " \
    freescale/imx8mp-evk.dtb \
    freescale/imx8mp-ab2.dtb \
    freescale/imx8mp-evk-basler.dtb \
    freescale/imx8mp-evk-basler-ov2775.dtb \
    freescale/imx8mp-evk-basler-ov5640.dtb \
    freescale/imx8mp-evk-dpdk.dtb \
    freescale/imx8mp-evk-dsp.dtb \
    freescale/imx8mp-evk-dual-basler.dtb \
    freescale/imx8mp-evk-dual-os08a20.dtb \
    freescale/imx8mp-evk-dual-ov2775.dtb \
    freescale/imx8mp-evk-ecspi-slave.dtb \
    freescale/imx8mp-evk-flexcan2.dtb \
    freescale/imx8mp-evk-hifiberry-dacplus.dtb \
    freescale/imx8mp-evk-inmate.dtb \
    freescale/imx8mp-evk-iqaudio-dacplus.dtb \
    freescale/imx8mp-evk-iqaudio-dacpro.dtb \
    freescale/imx8mp-evk-it6263-lvds-dual-channel.dtb \
    freescale/imx8mp-evk-jdi-wuxga-lvds-panel.dtb \
    freescale/imx8mp-evk-ndm.dtb \
    freescale/imx8mp-evk-os08a20.dtb \
    freescale/imx8mp-evk-os08a20-ov5640.dtb \
    freescale/imx8mp-evk-ov2775.dtb \
    freescale/imx8mp-evk-ov2775-ov5640.dtb \
    freescale/imx8mp-evk-pcie-ep.dtb \
    freescale/imx8mp-evk-revA3-8mic-revE.dtb \
    freescale/imx8mp-evk-rm67191.dtb \
    freescale/imx8mp-evk-rm67199.dtb \
    freescale/imx8mp-evk-root.dtb \
    freescale/imx8mp-evk-rpmsg.dtb \
    freescale/imx8mp-evk-rpmsg-lpv.dtb \
    freescale/imx8mp-evk-sof-pdm.dtb \
    freescale/imx8mp-evk-sof-wm8960.dtb \
    freescale/imx8mp-evk-spdif-lb.dtb \
    freescale/imx8mp-evk-usdhc1-m2.dtb \
    freescale/imx8mp-evk-8mic-swpdm.dtb \
"

KERNEL_DEVICETREE:remove:myd-js8mpq = \
    "${MYD_JS8MPQ_UNUSED_EVK_DTBS}"

# Assigning after the require overrides the EVK values (no forcevariable needed).
UBOOT_CONFIG_BASENAME = "myd-js8mpq"
UBOOT_DTB_NAME = "myd-js8mpq.dtb"

# HABv4 secure boot is enabled by default for MYD-JS8MPQ.  The board-scoped
# feature selects only this machine's i.MX8MP signing flow.
DISTRO_FEATURES:append = " sec_boot"
MYIR_IMX8MP_HAB_ENABLE = "${@bb.utils.contains('DISTRO_FEATURES', 'sec_boot', '1', '0', d)}"

# Drop EVK on-board WiFi features: they pull kernel-module-nxp-wlan, which
# conflicts with this board's aw-xm729 (same mlan/moal driver source).
MACHINE_FEATURES:remove = "nxp8997-pcie nxp8997-sdio nxp9098-pcie nxp9098-sdio \
                           nxpwifi-all-pcie nxpwifi-all-sdio mrvl8997"

# On-board peripherals: WiFi module driver/firmware, BT init, 4G/5G dialer.
MACHINE_EXTRA_RRECOMMENDS += "aw-xm729 nxp-bt-init quectel-cm"

# Build an eMMC A/B image by default. Set OTA_SUPPORT = "0" in local.conf to
# retain the original single-copy extlinux layout.
OTA_SUPPORT ?= "1"

# Development signing-key fallback. When enabled, swupdate-signing-keys
# creates one persistent key set through Yocto's deploy/sstate mechanism and
# puts it below DEPLOY_DIR_IMAGE/swupdate-keys. Production builds should set
# this to "0" and override all three paths with externally managed secrets.
SWUPDATE_AUTO_GENERATE_KEYS ?= "1"
SWUPDATE_KEY_DEPLOY_DIR ?= "${DEPLOY_DIR_IMAGE}/swupdate-keys"
SWUPDATE_PRIVATE_KEY ?= "${SWUPDATE_KEY_DEPLOY_DIR}/priv.pem"
SWUPDATE_PUBLIC_KEY ?= "${SWUPDATE_KEY_DEPLOY_DIR}/swu_public.pem"
SWUPDATE_PASSWORD_FILE ?= "${SWUPDATE_KEY_DEPLOY_DIR}/priv.password"

# The factory-burn image embeds myir-image-emmc as a raw ext4 payload. The
# compressed variant is also embedded in the SWUpdate bundle in A/B mode.
IMAGE_FSTYPES:append = " ext4 ${@bb.utils.contains('OTA_SUPPORT', '1', 'ext4.gz', '', d)}"

WKS_FILE = "${@'myd-js8mpq-ab.wks.in' if d.getVar('OTA_SUPPORT') == '1' else d.getVar('SOC_DEFAULT_WKS_FILE')}"

DEFAULT_TIMEZONE = "Asia/Shanghai"

# Keep extlinux for single-copy images. The A/B image deliberately omits
# extlinux.conf so U-Boot's retained bootflow scan falls through to the
# slot-aware bsp_bootcmd.
UBOOT_EXTLINUX:use-nxp-bsp = "${@bb.utils.contains('OTA_SUPPORT', '1', '0', '1', d)}"
UBOOT_EXTLINUX_LABELS:use-nxp-bsp = "hdmiov56402g hdmiov5640"
UBOOT_EXTLINUX_TIMEOUT:use-nxp-bsp = "50"
UBOOT_EXTLINUX_DEFAULT_LABEL:use-nxp-bsp = "MYD-JS8MPQ HDMI OV5640 2G"

UBOOT_EXTLINUX_MENU_DESCRIPTION:hdmiov56402g:use-nxp-bsp = \
    "MYD-JS8MPQ HDMI OV5640 2G"
UBOOT_EXTLINUX_FDT:hdmiov56402g:use-nxp-bsp = \
    "../myd-js8mpq-hdmi-ov5640-2g.dtb"

UBOOT_EXTLINUX_MENU_DESCRIPTION:hdmiov5640:use-nxp-bsp = \
    "MYD-JS8MPQ HDMI OV5640"
UBOOT_EXTLINUX_FDT:hdmiov5640:use-nxp-bsp = \
    "../myd-js8mpq-hdmi-ov5640.dtb"

# Image and DTBs are placed in the root of the FAT boot partition.
UBOOT_EXTLINUX_KERNEL_IMAGE:use-nxp-bsp = "../Image"

# mmcdev is adjusted by board_late_mmc_env_init() according to boot media.
UBOOT_EXTLINUX_ROOT:use-nxp-bsp = \
    "root=/dev/mmcblk${mmcdev}p2"

# Preserve the important parameters currently supplied by mmcargs.
UBOOT_EXTLINUX_KERNEL_ARGS:use-nxp-bsp = \
    "rootwait rw ${jh_clk} ${mcore_clk} ${earlycon} loglevel=${loglevel} crashkernel=${crashkernel}"

UBOOT_EXTLINUX_CONSOLE:use-nxp-bsp = \
    "console=${console}"

IMAGE_BOOT_FILES:append:use-nxp-bsp = \
    "${@bb.utils.contains('OTA_SUPPORT', '1', '', ' extlinux.conf;extlinux/extlinux.conf', d)}"
