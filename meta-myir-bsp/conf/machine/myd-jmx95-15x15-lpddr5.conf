#@TYPE: Machine
#@NAME: MYD-JMX95 15x15 Evaluation Kit with LPDDR5
#@SOC: i.MX95
#@DESCRIPTION: Machine configuration for NXP i.MX 95 15x15 EVK with LPDDR5
#@MAINTAINER: Mazel Li <Mazel.li@myir.cn>

MACHINEOVERRIDES =. "mx95:"

require conf/machine/include/myir-imx95.inc

#MACHINE_FEATURES:append:use-nxp-bsp = " hailo"

IMX_KERNEL_CONFIG_AARCH64 = "myd_jmx95_15x15_defconfig"

KERNEL_DEVICETREE_BASENAME = "myd-jmx95-15x15"

KERNEL_DEVICETREE:append:use-nxp-bsp = " \
    myir/myd-jmx95-15x15.dtb \
    myir/myd-jmx95-15x15-lvds-dual.dtb \
    myir/myd-jmx95-15x15-dsi-mipi101c.dtb \
    myir/myd-jmx95-15x15-lvds0-lvds1-ov5640.dtb \
    myir/myd-jmx95-15x15-lt9611-lvds1-ov5640.dtb \
    myir/myd-jmx95-15x15-4k-lt9611-lvds1-ov5640.dtb \
"

UBOOT_CONFIG_BASENAME = "myd_jmx95_15x15"

IMXBOOT_TARGETS_BASENAME = "flash"

OEI_BOARD  = "mx95lp5-4g-15"
DDR_TYPE   = "lpddr5"
DDR_FIRMWARE_NAME = " \
    lpddr5_dmem_v202409.bin \
    lpddr5_dmem_qb_v202409.bin \
    lpddr5_imem_v202409.bin \
    lpddr5_imem_qb_v202409.bin \
"
OEI_DDR_CONFIG     = "MIMX95_LPDDR5_EVK_15X15_4266MTS_FW2024.09_timing"
OEI_DDR_CONFIG_ECC = "MIMX95_LPDDR5_EVK_15X15_4266MTS_FW2024.09_ECC_enabled_timing"

# rutabaga-gfx: Rust/crosvm virtual GPU, fragile crate build
# Only QEMU uses it, remove globally for this machine
PACKAGECONFIG:remove = "rutabaga-gfx"
IMAGE_FSTYPES:append = " ext4"
M4_DEFAULT_IMAGE_MX95 = "imx95-15x15-evk_m7_TCM_power_mode_switch.bin"

#DISTRO_FEATURES:append = " sec_boot"
MYIR_AHAB_ENABLE = "${@bb.utils.contains('DISTRO_FEATURES', 'sec_boot', '1', '0', d)}"
MYIR_AHAB_CST_DIR = "${TOPDIR}/keys/cst"
MYIR_AHAB_CST_SRK_INDEX = "1"
#INHERIT += "${@bb.utils.contains('DISTRO_FEATURES', 'sec_boot', 'myir-boot-signed', '', d)}"
#UBOOT_SIGN_ENABLE = "0"
DUAL_ROOTFS = "${@bb.utils.contains('DISTRO_FEATURES', 'sec_boot', 'dual', '', d)}"
SIGNED_BOOT = "${@bb.utils.contains('DISTRO_FEATURES', 'sec_boot', 'signed', '', d)}"

SECURE_BOOT_FILES = " \
    os_cntr_signed.bin \
    os_cntr_signed_4k-lt9611-lvds1-ov5640.bin \
    os_cntr_signed_dsi-mipi101c.bin \
    os_cntr_signed_lt9611-lvds1-ov5640.bin \
    os_cntr_signed_lvds0-lvds1-ov5640.bin \
    os_cntr_signed_lvds-dual.bin \
"

IMAGE_BOOT_FILES:append = " \
${@bb.utils.contains('MYIR_FITIMAGE_BOOT', '1', '', bb.utils.contains('DISTRO_FEATURES', 'sec_boot', '${SECURE_BOOT_FILES}', '', d), d)} \
"
IMAGE_BOOT_FILES:remove = " \
${@bb.utils.contains('MYIR_FITIMAGE_BOOT', '1', '', bb.utils.contains('DISTRO_FEATURES', 'sec_boot', 'Image', '', d), d)} \
"

IMAGE_BOOT_FILES:append = " \
    mcore-demos/imx95-15x15-evk_m7_TCM_power_mode_switch.bin \
    mcore-demos/imx95-15x15-evk_m7_TCM_rpmsg_lite_pingpong_rtos_linux_remote.bin \
    mcore-demos/imx95-15x15-evk_m7_TCM_rpmsg_lite_str_echo_rtos.bin \
    mcore-demos/imx95-15x15-evk_m7_TCM_sai_low_power_audio.bin \
"


MACHINE_FEATURES:remove = " xen"
# Set time zone
DEFAULT_TIMEZONE = "Asia/Shanghai"

# ============================================================
#  dm-verity + fitImage + overlayfs
# ============================================================

ENABLE_DM_VERITY      ?= "0"
ENABLE_OVERLAYFS      ?= "0"
ENABLE_ROOTHASH_SIGN  ?= "0"
MYIR_FITIMAGE_BOOT    ?= "0"

# ======== dm-verity ========
#INHERIT += "${@bb.utils.contains('ENABLE_DM_VERITY', '1', 'myir-dmverity', '', d)}"
DM_VERITY_IMAGE ?= "${@bb.utils.contains('ENABLE_DM_VERITY', '1', 'myir-image-emmc', '', d)}"
DM_VERITY_IMAGE_TYPE    = "ext4"
DM_VERITY_SEPARATE_HASH = "0"

# ======== fitImage + initramfs ========
KERNEL_CLASSES:append        = "${@bb.utils.contains('MYIR_FITIMAGE_BOOT', '1', ' kernel-fitimage', '', d)}"
KERNEL_IMAGETYPE:forcevariable = "${@bb.utils.contains('MYIR_FITIMAGE_BOOT', '1', 'fitImage', 'Image', d)}"
KERNEL_IMAGETYPE_REPLACEMENT   = "${@bb.utils.contains('MYIR_FITIMAGE_BOOT', '1', 'Image', '', d)}"
KERNEL_IMAGE_NAME:prepend    = "${@bb.utils.contains('ENABLE_DM_VERITY', '1', '${INITRAMFS_IMAGE_NAME}-', '', d)}"
INITRAMFS_IMAGE         = "${@bb.utils.contains('ENABLE_DM_VERITY', '1', 'myir-initramfs-dmverity', '', d)}"
INITRAMFS_IMAGE_BUNDLE  = "${@bb.utils.contains('ENABLE_DM_VERITY', '1', '0', '', d)}"
ENABLE_FITIMAGE_SIGN      = "${MYIR_FITIMAGE_BOOT}"

# ======== overlayfs ========
MYIR_DM_VERITY_OVERLAY       = "${ENABLE_OVERLAYFS}"
MYIR_OVERLAY_PARTITION_SIZE  = "2048"

# ======== root hash ========
MYIR_DM_VERITY_SIGN_ROOTHASH = "${ENABLE_ROOTHASH_SIGN}"

# ======== FIT ========
UBOOT_SIGN_ENABLE      = "${ENABLE_FITIMAGE_SIGN}"
UBOOT_SIGN_ENABLE:pn-imx-boot = "0"
FIT_GENERATE_KEYS      = "${ENABLE_FITIMAGE_SIGN}"
UBOOT_SIGN_KEYDIR      = "${@bb.utils.contains('ENABLE_FITIMAGE_SIGN', '1', '${TOPDIR}/keys/fit', '', d)}"
UBOOT_SIGN_KEYNAME     = "${@bb.utils.contains('ENABLE_FITIMAGE_SIGN', '1', 'dev', '', d)}"
UBOOT_SIGN_IMG_KEYNAME = "${@bb.utils.contains('ENABLE_FITIMAGE_SIGN', '1', 'dev2', '', d)}"

# ======== WIC  ========
#WKS_FILE = "${@bb.utils.contains('ENABLE_DM_VERITY', '1', 'myd-jmx95-15x15-lpddr5-dmverity-overlay.wks.in', 'xxx.wks.in', d)}"
# ENABLE_DM_VERITY=1
INHERIT += "${@bb.utils.contains('ENABLE_DM_VERITY', '1', 'myir-boot-signed myir-dmverity', bb.utils.contains('DISTRO_FEATURES', 'sec_boot', 'myir-boot-signed', '', d), d)}"

UBOOT_ENTRYPOINT:mx95-generic-bsp = "${@bb.utils.contains('ENABLE_DM_VERITY', '1', '0x94000000', '', d)}"


#MYIR_OPTEE_STORAGE = "rpmb"
#MYIR_RPMB_MODE = "test"
OVERRIDES:append = "${@':dm-verity' if d.getVar('ENABLE_DM_VERITY') == '1' else ''}"

MYIR_OPTEE_STORAGE:dm-verity = "rpmb"
MYIR_RPMB_MODE:dm-verity = "test"
